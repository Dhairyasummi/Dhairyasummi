name: Dynamic Content Update

on:
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-content:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub
          
      - name: Update Dynamic Content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import requests
          from datetime import datetime
          from github import Github
          
          # Get current time
          current_time = datetime.now().strftime("%B %d, %Y at %H:%M UTC")
          
          print(f"✅ Dynamic content refresh triggered at {current_time}")
          print("📊 Stats will auto-refresh on view")
          print("🐍 Snake animation will be generated by separate workflow")
          
          # You can add custom logic here to update specific parts of README
          # For example, fetching latest blog posts, updating project counts, etc.
          
          EOF
          
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if there are changes
          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "🤖 Auto-update: Dynamic content refresh"
            git push
          else
            echo "No changes to commit"
          fi
